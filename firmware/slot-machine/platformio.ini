; PlatformIO project for the T-Dongle-S3 Slot Machine
;
; Board: LilyGO T-Dongle-S3 (ESP32-S3, 16MB flash, no PSRAM)
;   - 0.96" ST7735 IPS LCD, 160x80, driven by TFT_eSPI
;   - APA102 RGB LED (2-wire clock+data) on GPIO39/40
;   - BOOT button on GPIO0 is the roll/spin button
;
; Build & flash:
;   pio run -t upload
;   pio device monitor
;
; The `boards/dongles3.json` file here is copied verbatim from LilyGO's own
; T-Dongle-S3 repo, so PlatformIO recognises the correct flash size (16MB),
; partition table and native-USB build flags without installing anything
; extra: a project-local `boards/` folder is picked up automatically.

[env:t-dongle-s3]
platform = espressif32@6.12.0
framework = arduino
board = dongles3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    fastled/FastLED@^3.9.4
    mathertel/OneButton@^2.6.1

build_flags =
    ; ---- TFT_eSPI display driver config (ST7735, 160x80, T-Dongle-S3 wiring) ----
    ; Configures TFT_eSPI entirely via build flags so nothing inside the
    ; library itself needs hand-editing (the usual User_Setup.h dance).
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80
    ; TFT_RGB_ORDER deliberately left undefined: ST7735_Defines.h's own
    ; #ifndef default for GREENTAB160x80 is BGR, matching this panel.
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
